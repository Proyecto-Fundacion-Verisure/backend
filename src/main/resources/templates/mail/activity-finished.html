<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org" th:replace="~{mail/layout :: base(~{::#content})}">
<body>
<div id="content">
    <h1 style="margin:0 0 16px; font-size:20px; color:#27272a;">Cuéntanos cómo fue</h1>
    <p style="margin:0 0 12px;">Hola <span th:text="${userName}">nombre</span>,</p>
    <p style="margin:0 0 12px;">Ha terminado:</p>
    <p style="margin:0 0 12px;"><strong th:text="${activityTitle}">actividad</strong>, del <span th:text="${startDate}">fecha</span> al <span th:text="${endDate}">fecha</span>.</p>
    <p style="margin:0 0 12px;">Solo queda que registres tu cierre de participación con las horas reales que dedicaste. Es lo que genera tu certificado.</p>
    <p style="margin:28px 0 0;">
        <a th:href="${link}" href="#"
           style="display:inline-block; padding:12px 24px; background-color:#ff6f61;
                  color:#ffffff; text-decoration:none; border-radius:6px;
                  font-weight:bold;">Registrar mi cierre</a>
    </p>
</div>
</body>
</html>
