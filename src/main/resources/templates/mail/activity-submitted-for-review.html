<!DOCTYPE html>
<!-- Actividad pendiente de revisión · Dueña: BE3 · Tarea: B3-09. -->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{mail/layout :: base(~{::#content})}">
<body>
<div id="content">
    <h1 style="margin:0 0 16px; font-size:20px; color:#27272a;">Hay una actividad esperando revisión</h1>
    <p style="margin:0 0 12px;">Hola <span th:text="${userName}">nombre</span>,</p>
    <p style="margin:0 0 12px;"><strong th:text="${partnerName}">entidad</strong> ha enviado a revisión <strong th:text="${activityTitle}">actividad</strong>.</p>
    <p style="margin:0 0 12px;">Queda pendiente de aprobar o devolver.</p>
    <p style="margin:28px 0 0;">
        <a th:href="${link}" href="#"
           style="display:inline-block; padding:12px 24px; background-color:#ff6f61;
                  color:#ffffff; text-decoration:none; border-radius:6px;
                  font-weight:bold;">Revisar la actividad</a>
    </p>
</div>
</body>
</html>
