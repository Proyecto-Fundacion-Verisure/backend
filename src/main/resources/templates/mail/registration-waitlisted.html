<!DOCTYPE html>
<!-- Lista de espera · Dueña: BE3 · Tarea: B3-09. -->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{mail/layout :: base(~{::#content})}">
<body>
<div id="content">
    <h1 style="margin:0 0 16px; font-size:20px; color:#27272a;">Estás en lista de espera</h1>
    <p style="margin:0 0 12px;">Hola <span th:text="${userName}">nombre</span>,</p>
    <p style="margin:0 0 12px;">Hemos recibido tu solicitud para:</p>
    <p style="margin:0 0 12px;"><strong th:text="${activityTitle}">actividad</strong>, del <span th:text="${startDate}">fecha</span> al <span th:text="${endDate}">fecha</span>.</p>
    <p style="margin:0 0 12px;">Ahora mismo ocupas el puesto <strong th:text="${queuePosition}">1</strong> de la lista. Si queda una plaza libre, te avisamos automáticamente.</p>
    <p style="margin:28px 0 0;">
        <a th:href="${link}" href="#"
           style="display:inline-block; padding:12px 24px; background-color:#ff6f61;
                  color:#ffffff; text-decoration:none; border-radius:6px;
                  font-weight:bold;">Ver mis voluntariados</a>
    </p>
</div>
</body>
</html>
