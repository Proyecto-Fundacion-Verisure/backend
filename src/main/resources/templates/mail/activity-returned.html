<!DOCTYPE html>
<!-- Actividad devuelta · Dueña: BE3 · Tarea: B3-14. -->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{mail/layout :: base(~{::#content})}">
<body>
<div id="content">
    <h1 style="margin:0 0 16px; font-size:20px; color:#27272a;">Hemos devuelto tu actividad</h1>
    <p style="margin:0 0 12px;">Hola <span th:text="${userName}">nombre</span>,</p>
    <p style="margin:0 0 12px;">Para publicar <strong th:text="${activityTitle}">actividad</strong> hay que corregir esto:</p>
    <blockquote th:text="${reviewNote}"
                style="margin:16px 0; padding:12px 16px; background-color:#fafafa;
                       border-left:4px solid #ff6f61; color:#3f3f46;">comentario</blockquote>
    <p style="margin:0 0 12px;">Cuando lo tengas corregido, vuelve a enviarla a revisión.</p>
    <p style="margin:28px 0 0;">
        <a th:href="${link}" href="#"
           style="display:inline-block; padding:12px 24px; background-color:#ff6f61;
                  color:#ffffff; text-decoration:none; border-radius:6px;
                  font-weight:bold;">Editar la actividad</a>
    </p>
</div>
</body>
</html>
