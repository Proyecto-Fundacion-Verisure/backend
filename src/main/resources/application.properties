# Aplicación

spring.application.name=backend
server.port=8080
server.error.include-stacktrace=never

# Base de datos (PostgreSQL)

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate

spring.jpa.hibernate.ddl-auto=update
# Cambiar a create-drop solo si se necesita resetear el esquema en cada arranque:
# spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# No es opcional. Viene a true y mantiene la sesion de Hibernate abierta toda la
# peticion, con lo que las consultas perezosas funcionan "por accidente" y el
# N+1 que hay que vigilar se vuelve invisible.
spring.jpa.open-in-view=false

# Multipart (la evidencia del cierre de B1-03)

# El default de Spring (1 MB) es menor que el maximo de 10 MB que permite el
# contrato para la evidencia de B1-03. max-request-size deja margen para la
# parte request (JSON) dentro de la misma peticion.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Aplicacion (app.*)

# Base de los enlaces de los correos. Las plantillas NO llevan dominios fijos:
# se forman con app.base-url + la ruta que entrega FE2.
app.base-url=${APP_BASE_URL:http://localhost:5173}

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# JWT. El secreto NO tiene valor por defecto a proposito: uno de desarrollo
# escrito aqui seria el que acabaria en produccion. Generarlo con
#   openssl rand -base64 64
# y ponerlo en .env, que esta ignorado. Si falta, la aplicacion no arranca.
app.jwt.secret=${JWT_SECRET}

# La caducidad es la politica de revocacion completa: logout no revoca nada.
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:7200000}

# Correo. Las credenciales van en .env: Mailtrap es un buzon de pruebas que
# recoge todo y no entrega nada, para que treinta empleados con correos
# inventados no generen mil rebotes.
#
# El host viene vacio a proposito: sin el la aplicacion arranca igual y los
# envios fallan con un aviso en el registro, que es lo que permite trabajar
# sin credenciales.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Sin esto un servidor caido bloquea el hilo de envio indefinidamente.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=${MAIL_FROM:no-reply@verisure.ex}
